name: Build and Release

on:
  push:
    tags:
    - 'v*'

jobs:
  build:
    uses: otter-sec/workflows/.github/workflows/build-image.yaml@main
    with:
      environment: prod
      name: app
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write

  release:
    needs: build
    uses: otter-sec/workflows/.github/workflows/deploy-to-cloud-run.yaml@main
    with:
      environment: prod
      containers: |
        [
          {
            "name": "app",
            "image": "app:${{ github.ref_name }}"
          }
        ]
    permissions:
      contents: read
      id-token: write
